<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>120 سؤال | الاضطرابات المعرفية - ستة فصول</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.25s ease, color 0.2s ease, border-color 0.2s ease;
        }

        body {
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            padding: 1rem;
            position: relative;
        }

        /* ========== الوضع الليلي (الغامق) ========== */
        body.dark {
            background: linear-gradient(145deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            color: #e2e8f0;
        }
        body.dark::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at 30% 40%, rgba(139, 92, 246, 0.1), rgba(59, 130, 246, 0.05));
            pointer-events: none;
            z-index: 0;
        }
        body.dark .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(2px 2px at 15% 40%, #eab308, rgba(0,0,0,0)), radial-gradient(1.5px 1.5px at 75% 85%, #fbbf24, rgba(0,0,0,0));
            background-size: 200px 220px, 300px 280px;
            background-repeat: repeat;
            opacity: 0.2;
            pointer-events: none;
            z-index: 0;
        }

        /* ========== الوضع الفاتح ========== */
        body.light {
            background: linear-gradient(145deg, #fef9e3 0%, #fff6e0 50%, #fffbeb 100%);
            color: #2d2a1f;
        }
        body.light::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at 30% 40%, rgba(245, 158, 11, 0.08), rgba(255, 215, 0, 0.05));
            pointer-events: none;
            z-index: 0;
        }
        body.light .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(2px 2px at 15% 40%, #eab308, rgba(0,0,0,0)), radial-gradient(1.5px 1.5px at 75% 85%, #f59e0b, rgba(0,0,0,0));
            background-size: 200px 220px, 300px 280px;
            background-repeat: repeat;
            opacity: 0.3;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }

        /* الهيدر والتبويبات بالذهب */
        .hero {
            text-align: center;
            margin-bottom: 1.5rem;
            border-radius: 50px;
            padding: 1rem;
            backdrop-filter: blur(10px);
        }
        body.dark .hero {
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.4), rgba(139, 92, 246, 0.15));
            border: 1px solid rgba(234, 179, 8, 0.5);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3), 0 0 12px rgba(234,179,8,0.3);
        }
        body.light .hero {
            background: rgba(255, 245, 210, 0.85);
            border: 1px solid rgba(245, 158, 11, 0.7);
            box-shadow: 0 8px 20px rgba(0,0,0,0.08), 0 0 12px rgba(245,158,11,0.3);
        }
        .hero h1 {
            font-size: 1.5rem;
            font-weight: 900;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        body.dark .hero h1 {
            background: linear-gradient(135deg, #fbbf24, #eab308, #f59e0b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 5px rgba(234,179,8,0.3);
        }
        body.light .hero h1 {
            background: linear-gradient(135deg, #b45309, #d97706, #f59e0b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .hero p {
            font-size: 0.75rem;
        }
        body.dark .hero p { color: #cbd5e1; }
        body.light .hero p { color: #7c6a3e; }
        .total-badge {
            background: linear-gradient(95deg, #eab308, #f59e0b);
            padding: 0.2rem 1rem;
            border-radius: 50px;
            font-size: 0.7rem;
            display: inline-block;
            margin-top: 6px;
            font-weight: bold;
            color: #2d2a1f;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        /* ازرار التبويبات */
        .tab-nav {
            display: flex;
            justify-content: center;
            gap: 0.6rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        .tab-btn {
            border-radius: 40px;
            padding: 0.5rem 1.2rem;
            font-size: 0.8rem;
            font-weight: 800;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            transition: 0.2s;
            backdrop-filter: blur(8px);
        }
        body.dark .tab-btn {
            background: rgba(30, 27, 75, 0.7);
            border: 1px solid rgba(234, 179, 8, 0.4);
            color: #fde68a;
        }
        body.light .tab-btn {
            background: #fff6e5;
            border: 1px solid #eab308;
            color: #b45309;
        }
        .tab-btn.active {
            background: linear-gradient(95deg, #eab308, #f59e0b);
            color: #1f1b0a;
            border-color: transparent;
            box-shadow: 0 4px 12px rgba(234,179,8,0.5);
        }
        .tab-btn:hover:not(.active) {
            background: rgba(234, 179, 8, 0.25);
        }

        /* المحتوى */
        .tab-content {
            display: none;
            animation: fadeUp 0.3s ease;
        }
        .tab-content.active-tab {
            display: block;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .questions-flow {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* بطاقات الأسئلة */
        .question-card {
            border-radius: 1.5rem;
            padding: 1rem 1.3rem;
            backdrop-filter: blur(12px);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        body.dark .question-card {
            background: linear-gradient(145deg, rgba(30, 27, 75, 0.75), rgba(15, 23, 42, 0.85));
            border-right: 4px solid #eab308;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.3);
        }
        body.light .question-card {
            background: rgba(255, 251, 235, 0.95);
            border-right: 4px solid #f59e0b;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.05);
            color: #3b2b1f;
        }
        .question-card:hover {
            transform: translateX(-4px);
        }
        body.dark .question-card:hover {
            box-shadow: 0 10px 24px rgba(234,179,8,0.2);
        }
        body.light .question-card:hover {
            box-shadow: 0 10px 20px rgba(245,158,11,0.15);
        }

        .q-header {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 0.7rem;
            flex-wrap: wrap;
        }
        .q-num {
            background: linear-gradient(95deg, #eab308, #f59e0b);
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 800;
            color: #2d2a1f;
        }
        .q-text {
            font-size: 0.95rem;
            font-weight: 700;
            line-height: 1.45;
            flex: 1;
        }
        body.light .q-text { color: #2c2416; }

        .options {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin: 0.6rem 0;
        }
        .opt {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0.4rem 1rem;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.2s;
        }
        body.dark .opt {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(234, 179, 8, 0.3);
        }
        body.light .opt {
            background: #fef5e7;
            border: 1px solid #fcd34d;
        }
        .opt:hover {
            transform: translateX(5px);
            background: rgba(245, 158, 11, 0.25);
        }
        input[type="radio"] {
            width: 16px;
            height: 16px;
            accent-color: #f59e0b;
            cursor: pointer;
        }
        label {
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            flex: 1;
        }
        body.light label { color: #4a3b26; }

        .check-btn {
            background: linear-gradient(95deg, #eab308, #f59e0b);
            border: none;
            padding: 0.35rem 1.3rem;
            border-radius: 40px;
            font-weight: 800;
            font-size: 0.75rem;
            color: #211c0e;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: 'Cairo', sans-serif;
            transition: 0.2s;
            margin-top: 0.3rem;
        }
        .check-btn:hover:not(:disabled) {
            transform: scale(1.02);
            box-shadow: 0 0 8px gold;
        }
        .check-btn:disabled {
            opacity: 0.5;
            cursor: default;
        }

        .feedback {
            margin-top: 8px;
            padding: 4px 14px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.7rem;
            display: inline-block;
        }
        body.dark .feedback.correct {
            background: #065f46;
            color: #d1fae5;
            border-right: 3px solid #34d399;
        }
        body.light .feedback.correct {
            background: #dcfce7;
            color: #166534;
            border-right: 3px solid #16a34a;
        }
        body.dark .feedback.wrong {
            background: #991b1b;
            color: #fee2e2;
            border-right: 3px solid #f87171;
        }
        body.light .feedback.wrong {
            background: #fee2e2;
            color: #991b1b;
            border-right: 3px solid #ef4444;
        }

        .progress-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
            border-radius: 40px;
            padding: 0.3rem 1.2rem;
        }
        body.dark .progress-bar {
            background: rgba(30, 27, 75, 0.5);
        }
        body.light .progress-bar {
            background: #fff0da;
            border: 1px solid #fde68a;
        }
        .progress-text {
            font-size: 0.7rem;
            font-weight: bold;
        }
        .reset-btn {
            background: rgba(245, 158, 11, 0.3);
            border: 1px solid #eab308;
            padding: 0.25rem 1rem;
            border-radius: 30px;
            font-size: 0.7rem;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            transition: 0.2s;
        }
        body.dark .reset-btn { color: #fde68a; background: rgba(234,179,8,0.2); }
        body.light .reset-btn { color: #b45309; background: #fff2df; }
        .reset-btn:hover {
            background: #eab308;
            color: #1f1b0a;
        }

        /* مفتاح الوضع الفاتح/الغامق */
        .theme-switch-wrapper {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 999;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(12px);
            border-radius: 60px;
            padding: 6px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid #eab308;
            box-shadow: 0 0 12px rgba(234,179,8,0.5);
        }
        body.light .theme-switch-wrapper {
            background: rgba(255,245,200,0.95);
            border: 1px solid #f59e0b;
        }
        .theme-icon i {
            font-size: 1.2rem;
            color: #fbbf24;
            text-shadow: 0 0 3px gold;
        }
        .toggle-switch {
            width: 50px;
            height: 24px;
            background: #3b3b4f;
            border-radius: 30px;
            position: relative;
            cursor: pointer;
            border: 1px solid #eab308;
        }
        .toggle-switch:before {
            content: "";
            position: absolute;
            width: 20px;
            height: 20px;
            background: #fbbf24;
            border-radius: 50%;
            top: 1px;
            left: 3px;
            transition: 0.25s;
        }
        body.light .toggle-switch:before {
            transform: translateX(24px);
            background: #f59e0b;
        }
        body.light .toggle-switch {
            background: #d4a373;
        }

        footer {
            text-align: center;
            margin-top: 1.8rem;
            padding: 0.7rem;
            font-size: 0.65rem;
            border-top: 1px solid rgba(234, 179, 8, 0.3);
        }
        body.dark footer { color: #64748b; }
        body.light footer { color: #ad8b4c; }

        @media (max-width: 650px) {
            .tab-btn { padding: 0.35rem 0.8rem; font-size: 0.7rem; }
            .q-text { font-size: 0.85rem; }
            label { font-size: 0.75rem; }
            .theme-switch-wrapper { top: 10px; left: 10px; padding: 4px 10px; }
        }
    </style>
</head>
<body class="dark">
<div class="particles"></div>

<!-- مفتاح التبديل بين الوضع الفاتح والغامق -->
<div class="theme-switch-wrapper">
    <div class="theme-icon"><i class="fas fa-sun"></i></div>
    <div class="toggle-switch" id="themeToggler"></div>
    <div class="theme-icon"><i class="fas fa-moon"></i></div>
</div>

<div class="container">
    <div class="hero">
        <h1><i class="fas fa-crown"></i> أسئلة إضطرابات معرفية <i class="fas fa-brain"></i></h1>
        <p>الفصل الأول · الثاني · الثالث · الرابع · الخامس  · السادس</p>
        <div class="total-badge"><i class="fas fa-star"></i> 3rd speech department · 120 سؤالاً <i class="fas fa-star"></i></div>
    </div>

    <div class="tab-nav">
        <button class="tab-btn active" data-tab="tab1"><i class="fas fa-book"></i> الفصل الأول</button>
        <button class="tab-btn" data-tab="tab2"><i class="fas fa-diagnoses"></i> الفصل الثاني</button>
        <button class="tab-btn" data-tab="tab3"><i class="fas fa-eye"></i> الفصل الثالث</button>
        <button class="tab-btn" data-tab="tab4"><i class="fas fa-chart-line"></i> الفصل الرابع</button>
        <button class="tab-btn" data-tab="tab5"><i class="fas fa-database"></i> الفصل الخامس</button>
        <button class="tab-btn" data-tab="tab6"><i class="fas fa-gem"></i> الفصل السادس</button>
    </div>

    <div id="tab1" class="tab-content active-tab"><div class="questions-flow" id="chap1Flow"></div><div class="progress-bar"><span class="progress-text" id="chap1Progress">📊 0/20</span><button class="reset-btn" data-chap="chap1">↺ إعادة</button></div></div>
    <div id="tab2" class="tab-content"><div class="questions-flow" id="chap2Flow"></div><div class="progress-bar"><span class="progress-text" id="chap2Progress">📊 0/20</span><button class="reset-btn" data-chap="chap2">↺ إعادة</button></div></div>
    <div id="tab3" class="tab-content"><div class="questions-flow" id="chap3Flow"></div><div class="progress-bar"><span class="progress-text" id="chap3Progress">📊 0/20</span><button class="reset-btn" data-chap="chap3">↺ إعادة</button></div></div>
    <div id="tab4" class="tab-content"><div class="questions-flow" id="chap4Flow"></div><div class="progress-bar"><span class="progress-text" id="chap4Progress">📊 0/20</span><button class="reset-btn" data-chap="chap4">↺ إعادة</button></div></div>
    <div id="tab5" class="tab-content"><div class="questions-flow" id="chap5Flow"></div><div class="progress-bar"><span class="progress-text" id="chap5Progress">📊 0/20</span><button class="reset-btn" data-chap="chap5">↺ إعادة</button></div></div>
    <div id="tab6" class="tab-content"><div class="questions-flow" id="chap6Flow"></div><div class="progress-bar"><span class="progress-text" id="chap6Progress">📊 0/20</span><button class="reset-btn" data-chap="chap6">↺ إعادة</button></div></div>

    <footer>Aya Gaber</footer>
</div>

<script>
    // ===================== الفصل الأول - 20 سؤال (بدون تغيير) =====================
    const chap1 = [
        { text: "أي من الآتي يمثل جوهر العمليات المعرفية التي تميز الإنسان عن غيره من الكائنات؟", options: ["الاستجابات الانعكاسية للمثيرات البيئية", "تحويل المدخل الحسي وتخزينه واستعادته", "قياس السلوك الظاهري القابل للملاحظة", "تحليل الصراعات اللاواعية المكبوتة"], correct: 1 },
        { text: "كيف يمكن تمييز الاتجاه المعرفي عن الاتجاه السلوكي في تفسير السلوك الإنساني؟", options: ["السلوكي يهتم بالعمليات العقلية الداخلية", "المعرفي يرى أن السلوك مجرد ردود فعل آلية", "المعرفي يؤكد وجود عمليات وسيطة بين المثير والاستجابة", "السلوكي يرفض دور الخبرات السابقة تماماً"], correct: 2 },
        { text: "أي من العلماء التاليين عرّف علم النفس المعرفي بأنه 'فهم المعرفة الإنسانية وعلاقتها بسلوك الفرد'؟", options: ["ألريك نيسر", "بيست", "هنت", "ستيرنبرغ"], correct: 1 },
        { text: "ما المبرر المنهجي الذي دفع علماء النفس المعرفي لرفض الاعتماد على منهج الاستبطان؟", options: ["صعوبة تدريب الأفراد على وصف محتويات وعيهم", "عدم استيفائه معايير البحث العلمي من موضوعية وثبات", "حاجته إلى أجهزة معملية متطورة وغير متوفرة", "عدم قدرته على قياس زمن الرجع بدقة"], correct: 1 },
        { text: "أي من الإجراءات التالية اتبعها إبنجهاوس للتحكم في تأثير الخبرات السابقة على التعلم؟", options: ["استخدام كلمات من لغة أجنبية غير معروفة", "استخدام مقاطع عديمة المعنى (ثلاثة أحرف ساكن ومتحرك)", "تكرار عرض الكلمات عدة مرات قبل بدء التجربة", "تدريب المفحوصين على الاستبطان قبل بدء التجربة"], correct: 1 },
        { text: "في منحنى إبنجهاوس للنسيان، متى يحدث أكبر قدر من فقدان المعلومات المخزنة؟", options: ["بعد مرور أسبوع كامل من التعلم", "بعد مرور شهر من تاريخ التعلم", "في الساعة الأولى مباشرة بعد التعلم", "بعد مرور 24 ساعة فقط من التعلم"], correct: 2 },
        { text: "ما المقصود بـ'الكف الرجعي' كأحد الآليات المفسرة للنسيان؟", options: ["تأثير تعلم الفعاليات السابقة على تذكر الفعاليات اللاحقة", "تأثير تعلم الفعاليات اللاحقة على تذكر الفعاليات السابقة", "اضمحلال وتلاشي أثر الذاكرة مع مرور الزمن", "كبت الخبرات المؤلمة في اللاشعور"], correct: 1 },
        { text: "أي من المجالات التالية لا يعتبر من المكونات الأساسية لعلم النفس المعرفي؟", options: ["الإدراك والانتباه والذاكرة", "حل المشكلات والذكاء الإنساني", "التحليل النفسي ودراسة الغرائز", "اللغة والمفاهيم والتمثيل المعرفي"], correct: 2 },
        { text: "ما الذي يعنيه 'تمثيل المعرفة' في إطار النظام المعرفي للإنسان؟", options: ["التسجيل الحسي المباشر للمثيرات", "تحويل المثيرات والخبرات إلى معاني وأفكار قابلة للتخزين", "الاستجابة التلقائية للمنبهات دون معالجة", "الاحتفاظ المؤقت بالمعلومات أثناء معالجتها فقط"], correct: 1 },
        { text: "أي من الأمثلة التالية يمثل حدوث عمليات معرفية في غياب المثيرات المرتبطة بها؟", options: ["الشعور بالألم عند لمس سطح ساخن", "الرمش اللاإرادي عند اقتراب جسم من العين", "تكوين صورة ذهنية عن مكان لم تزره من قبل", "سيلان اللعاب تلقائياً عند رؤية الطعام"], correct: 2 },

    const chapters = { chap1, chap2, chap3, chap4, chap5, chap6 };
    let states = { chap1: {}, chap2: {}, chap3: {}, chap4: {}, chap5: {}, chap6: {} };

    function buildChapter(containerId, questions, chapKey) {
        const container = document.getElementById(containerId);
        if (!container) return;
        container.innerHTML = '';
        questions.forEach((q, idx) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.innerHTML = `
                <div class="q-header"><span class="q-num">${idx+1}</span><span class="q-text">${q.text}</span></div>
                <div class="options" id="opts-${chapKey}-${idx}"></div>
                <button class="check-btn" id="check-${chapKey}-${idx}"><i class="fas fa-check"></i> تأكيد</button>
                <div class="feedback" id="fb-${chapKey}-${idx}"></div>
            `;
            container.appendChild(card);
            const optsDiv = document.getElementById(`opts-${chapKey}-${idx}`);
            q.options.forEach((opt, optIdx) => {
                const optDiv = document.createElement('div');
                optDiv.className = 'opt';
                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.name = `${chapKey}_${idx}`;
                radio.value = optIdx;
                radio.id = `${chapKey}_${idx}_opt${optIdx}`;
                if (states[chapKey][idx]) radio.disabled = true;
                const label = document.createElement('label');
                label.htmlFor = `${chapKey}_${idx}_opt${optIdx}`;
                label.innerText = opt;
                optDiv.appendChild(radio);
                optDiv.appendChild(label);
                optsDiv.appendChild(optDiv);
            });
            const checkBtn = document.getElementById(`check-${chapKey}-${idx}`);
            const fbDiv = document.getElementById(`fb-${chapKey}-${idx}`);
            if (states[chapKey][idx]) {
                checkBtn.disabled = true;
                fbDiv.innerHTML = states[chapKey][idx].text;
                fbDiv.className = states[chapKey][idx].cls;
            }
            checkBtn.addEventListener('click', () => {
                const selected = document.querySelector(`input[name="${chapKey}_${idx}"]:checked`);
                if (!selected) { fbDiv.innerHTML = "⚠️ اختر إجابة"; fbDiv.style.background = "#451a0e"; setTimeout(() => { if(fbDiv.innerHTML === "⚠️ اختر إجابة") fbDiv.innerHTML = ""; }, 1500); return; }
                const val = parseInt(selected.value);
                const isCor = val === q.correct;
                const letter = String.fromCharCode(65 + q.correct);
                if (isCor) {
                    fbDiv.innerHTML = `✓ صحيح. ${letter}. ${q.options[q.correct]}`;
                    fbDiv.className = "feedback correct";
                } else {
                    fbDiv.innerHTML = `✗ خطأ. الصواب: ${letter}. ${q.options[q.correct]}`;
                    fbDiv.className = "feedback wrong";
                }
                document.querySelectorAll(`input[name="${chapKey}_${idx}"]`).forEach(r => r.disabled = true);
                checkBtn.disabled = true;
                states[chapKey][idx] = { text: fbDiv.innerHTML, cls: fbDiv.className };
                const progSpan = document.getElementById(`${chapKey}Progress`);
                const total = questions.length;
                const answered = Object.keys(states[chapKey]).length;
                if (progSpan) progSpan.innerHTML = `📊 ${answered}/${total}`;
            });
        });
        const progSpan = document.getElementById(`${chapKey}Progress`);
        if (progSpan) progSpan.innerHTML = `📊 0/${questions.length}`;
    }

    tabs.forEach(tab => {
        tab.addEventListener('click', () => {
            const target = tab.getAttribute('data-tab');
            contents.forEach(c => c.classList.remove('active-tab'));
            tabs.forEach(t => t.classList.remove('active'));
            document.getElementById(target).classList.add('active-tab');
            tab.classList.add('active');
        });
    });

    // نظام الوضع الفاتح/الغامق
    const toggler = document.getElementById('themeToggler');
    const body = document.body;
    const savedTheme = localStorage.getItem('cognitive_theme');
    if (savedTheme === 'light') {
        body.classList.remove('dark');
        body.classList.add('light');
    } else {
        body.classList.add('dark');
        body.classList.remove('light');
    }
    toggler.addEventListener('click', () => {
        if (body.classList.contains('dark')) {
            body.classList.remove('dark');
            body.classList.add('light');
            localStorage.setItem('cognitive_theme', 'light');
        } else {
            body.classList.remove('light');
            body.classList.add('dark');
            localStorage.setItem('cognitive_theme', 'dark');
        }
    });
</script>
</body>
</html>
